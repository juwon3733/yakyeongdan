name: ci
on:
  # 실패 메일이 겹쳐 오지 않게: main·그림 브랜치에 올릴 때와 PR에서만(작업 브랜치 push는 PR이나 main에서 한 번 돈다)
  push:
    branches: [main, 'assets/**']
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/export-prompts.mjs --check
      - run: node tools/check-assets.mjs
      - run: node tools/art-index.mjs --check
      - run: node tools/gen-docs.mjs --check
      - run: node tools/make-icons.mjs --check
      - run: node tools/sim.mjs --quick
      - run: npm install --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node tools/smoke.mjs
      # 전투 프레임 재기: 95% 프레임 시간이 33ms를 넘으면 경고만(CI 기계는 느릴 수 있어 실패로 치지 않는다)
      - run: node tools/fps.mjs
        continue-on-error: true
      - run: npm run shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
          retention-days: 7
          if-no-files-found: warn
