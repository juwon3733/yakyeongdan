name: cleanup-branches
# main에 내용이 다 들어간 브랜치를 지운다(그림 assets/…, 작업 feat/ fix/ chore/ docs/).
# Claude가 그림 브랜치를 파일 단위로 main에 옮기므로 git merge 여부가 아니라 "바뀐 파일이 전부 main과 같은지"로 본다.
# assets/art.json은 그림 목록이라 main에서 다시 만들어지므로 비교에서 뺀다. main과 claude/* 브랜치는 건드리지 않는다.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 다 들어간 브랜치 지우기
        shell: bash
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
            b=${ref#origin/}
            case "$b" in main|HEAD|origin|claude/*) continue;; esac
            base=$(git merge-base origin/main "$ref" 2>/dev/null) || continue
            files=$(git diff --name-only "$base" "$ref" -- . ':!assets/art.json')
            # 내용이 같거나, 브랜치의 커밋이 전부 같은 제목으로 main에 들어갔으면(리베이스로 옮긴 경우) 다 들어간 것
            missing=$(git log --format=%s "origin/main..$ref" | grep -vxF -f <(git log --format=%s origin/main) || true)
            if [ -z "$files" ] || git diff --quiet origin/main "$ref" -- $files || [ -z "$missing" ]; then
              echo "지움: $b"
              git push origin --delete "$b"
            else
              echo "남김(main과 다른 파일 있음): $b"
            fi
          done
